name: Validar Chañar a Mano

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validar:
    name: Revisar archivos antes de publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check datos.js
      - name: Validar estructura y datos
        run: node scripts/validar-guia.js
